<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <aside>
        <section class="aside-content">
            <img src="assets/img/odin-lined.png" alt="Logo de Odin">
            <h2>ODIN</h2>
        </section>
        <section class="aside-footer">
            <span>
                Foto de <a
                    href="https://unsplash.com/es/@j_mk18?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Jon</a>
                en <a
                    href="https://unsplash.com/es/fotos/fotografia-de-paisaje-de-montanas-r8AFUpRp0J0?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
            </span>
        </section>
    </aside>
    <main>
        <header>

            <p>
                This is not a real online service! You know you need something like this in your life to help you
                realize your deepest dreams.<br>Sign up <em>now</em> to get started
            </p>
            <p>
                You <em>know</em> you want to.
            </p>

        </header>
        <section>
            <form>
                <fieldset>
                    <legend>Let's do this!</legend>
                    <article class="container-form">
                        <div class="form-item">
                            <label for="first-name">FIRST NAME</label>
                            <input id="first-name" type="text" name="first-name">
                        </div>
                        <div class="form-item">
                            <label for="last-name">LAST NAME</label>
                            <input id="last-name" type="text" name="last-name">
                        </div>
                        <div class="form-item">
                            <label for="email">EMAIL</label>
                            <input id="email" type="email" name="email">
                        </div>
                        <div class="form-item">
                            <label for="phone">PHONE NUMBER</label>
                            <input id="phone" type="tel" name="phone">
                        </div>
                        <div class="form-item">
                            <label for="password">PASSWORD</label>
                            <input id="password" type="password" name="password" required>
                        </div>
                        <div class="form-item">
                            <label for="confirm-password">CONFIRM PASSWORD</label>
                            <input id="confirm-password" type="password" name="confirm-password" required>
                        </div>
                    </article>
                </fieldset>

                <div class="form-actions">
                    <button type="submit">Create Account</button>
                    <span>Already have an account? <a href="#">Log in</a></span>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
